# Menus
bindd = SUPER, SPACE, Launch apps, exec, debianarchy-launcher
bindd = SUPER CTRL, E, Emoji picker, exec, debianarchy-menu emoji
bindd = SUPER CTRL, C, Capture menu, exec, debianarchy-menu capture
bindd = SUPER ALT, SPACE, DebiAnarchy menu, exec, debianarchy-menu
bindd = SUPER, ESCAPE, System menu, exec, debianarchy-menu system
bindld = , XF86PowerOff, Power menu, exec, debianarchy-menu system
bindd = SUPER, K, Show key bindings, exec, debianarchy-keybindings
bindd = , XF86Calculator, Calculator, exec, gnome-calculator

# Aesthetics
bindd = SUPER SHIFT, SPACE, Toggle top bar, exec, debianarchy-toggle-waybar
bindd = SUPER SHIFT CTRL, SPACE, Theme menu, exec, debianarchy-menu theme
bindd = SUPER, BACKSPACE, Toggle window transparency, exec, hyprctl dispatch setprop active opaque toggle
bindd = SUPER SHIFT, BACKSPACE, Toggle window gaps, exec, debianarchy-toggle-gaps

# Notifications
bindd = SUPER, COMMA, Dismiss last notification, exec, makoctl dismiss
bindd = SUPER SHIFT, COMMA, Dismiss all notifications, exec, makoctl dismiss --all
bindd = SUPER CTRL, COMMA, Toggle silencing notifications, exec, makoctl mode -t do-not-disturb
bindd = SUPER ALT, COMMA, Invoke last notification, exec, makoctl invoke
bindd = SUPER SHIFT ALT, COMMA, Restore last notification, exec, makoctl restore

# Toggles
bindd = SUPER CTRL, I, Toggle locking on idle, exec, debianarchy-toggle-idle
bindd = SUPER CTRL, N, Toggle nightlight, exec, debianarchy-toggle-nightlight

# Captures
bindd = , PRINT, Screenshot, exec, debianarchy-capture-screenshot
bindd = SHIFT, PRINT, Screenshot (full screen), exec, debianarchy-capture-screenshot output
bindd = ALT, PRINT, Screenrecording, exec, debianarchy-capture-screenrecord
bindd = SUPER, PRINT, Color picker, exec, pkill hyprpicker || hyprpicker -a
bindd = SUPER CTRL, PRINT, Extract text (OCR) from screenshot, exec, debianarchy-capture-text

# Waybar-less information
bindd = SUPER CTRL ALT, T, Show time, exec, notify-send -u low "$(date +"%A %H:%M  ·  %d %B %Y  ·  Week %V")"
bindd = SUPER CTRL ALT, B, Show battery remaining, exec, notify-send -u low "Battery: $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo n/a)%"

# Control panels
bindd = SUPER CTRL, A, Audio controls, exec, debianarchy-launch-audio
bindd = SUPER CTRL, B, Bluetooth controls, exec, debianarchy-launch-bluetooth
bindd = SUPER CTRL, W, Wifi controls, exec, debianarchy-launch-wifi
bindd = SUPER CTRL, T, Activity, exec, debianarchy-launch-tui btop

# Zoom
bindd = SUPER CTRL, Z, Zoom in, exec, hyprctl keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float + 1')
bindd = SUPER CTRL ALT, Z, Reset zoom, exec, hyprctl keyword cursor:zoom_factor 1

# Lock system
bindd = SUPER CTRL, L, Lock system, exec, loginctl lock-session
