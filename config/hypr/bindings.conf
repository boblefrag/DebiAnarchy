# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(debianarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(debianarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER SHIFT, RETURN, Browser, exec, debianarchy-launch-browser
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(debianarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, B, Browser, exec, debianarchy-launch-browser
bindd = SUPER SHIFT ALT, B, Browser (private), exec, debianarchy-launch-browser --private
bindd = SUPER SHIFT, N, Editor, exec, uwsm-app -- xdg-terminal-exec nvim
bindd = SUPER SHIFT, D, Docker, exec, debianarchy-launch-tui lazydocker
bindd = SUPER SHIFT, T, Activity, exec, debianarchy-launch-tui btop
bindd = SUPER SHIFT, O, Obsidian, exec, debianarchy-launch-or-focus obsidian "flatpak run md.obsidian.Obsidian"
bindd = SUPER SHIFT, G, Signal, exec, debianarchy-launch-or-focus signal "flatpak run org.signal.Signal"
bindd = SUPER SHIFT, M, Music, exec, debianarchy-launch-or-focus spotify "flatpak run com.spotify.Client"

# If your web app url contains #, type it as ## to prevent hyprland treating it as a comment
bindd = SUPER SHIFT, A, ChatGPT, exec, debianarchy-launch-webapp "https://chatgpt.com"
bindd = SUPER SHIFT ALT, A, Claude, exec, debianarchy-launch-webapp "https://claude.ai"
bindd = SUPER SHIFT, E, Email, exec, debianarchy-launch-webapp "https://mail.google.com"
bindd = SUPER SHIFT, C, Calendar, exec, debianarchy-launch-webapp "https://calendar.google.com"
bindd = SUPER SHIFT, Y, YouTube, exec, debianarchy-launch-webapp "https://youtube.com/"
bindd = SUPER SHIFT ALT, G, WhatsApp, exec, debianarchy-launch-webapp "https://web.whatsapp.com/"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# Overwrite existing bindings, like putting the DebiAnarchy menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, DebiAnarchy menu, exec, debianarchy-menu
