[main]
include=~/.config/debianarchy/current/theme/fuzzel.ini
font=JetBrainsMono Nerd Font:size=12
prompt="  "
terminal=xdg-terminal-exec
launch-prefix=uwsm-app --
layer=overlay
namespace=launcher
width=50
lines=12
horizontal-pad=20
vertical-pad=14
inner-pad=8
icons-enabled=yes
icon-theme=Yaru
fields=filename,name,generic,keywords

[border]
width=2
radius=0
