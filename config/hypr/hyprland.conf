# Learn how to configure Hyprland: https://wiki.hypr.land/Configuring/

# DebiAnarchy defaults (don't edit these directly, override them below!)
source = ~/.local/share/debianarchy/default/hypr/autostart.conf
source = ~/.local/share/debianarchy/default/hypr/bindings/media.conf
source = ~/.local/share/debianarchy/default/hypr/bindings/clipboard.conf
source = ~/.local/share/debianarchy/default/hypr/bindings/tiling.conf
source = ~/.local/share/debianarchy/default/hypr/bindings/utilities.conf
source = ~/.local/share/debianarchy/default/hypr/envs.conf
source = ~/.local/share/debianarchy/default/hypr/looknfeel.conf
source = ~/.local/share/debianarchy/default/hypr/input.conf
source = ~/.local/share/debianarchy/default/hypr/windows.conf
source = ~/.config/debianarchy/current/theme/hyprland.conf

# Change your own setup in these files (and overwrite any settings from defaults!)
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/bindings.conf
source = ~/.config/hypr/looknfeel.conf
source = ~/.config/hypr/autostart.conf

